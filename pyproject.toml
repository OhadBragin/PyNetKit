[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pynetkit"
version = "1.0.0"
description = "A powerful, Nmap-inspired network discovery and security auditing toolkit with a Rich CLI and modern GUI."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Developer" }
]
dependencies = [
    "scapy==2.7.0",
    "rich==14.3.3",
    "rich-argparse==1.7.2",
    "ttkbootstrap>=1.10.0",
    "requests>=2.28.0"
]
keywords = ["network", "security", "scanner", "arp-spoofing", "dos", "cli", "gui", "ttkbootstrap", "scapy", "rich"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring"
]

[project.urls]
Homepage = "https://github.com/OhadBragin/pynetkit"

[project.scripts]
pynetkit = "pynetkit.main:main"

[tool.setuptools.packages.find]
include = ["pynetkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]