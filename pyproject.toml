[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pynetkit"
version = "1.0.0"
description = "A powerful, Nmap-inspired network discovery and security auditing toolkit with a Rich CLI and modern GUI."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    { name = "PyNetKit Contributors" }
]
dependencies = [
    "scapy==2.7.0",
    "rich==14.3.3",
    "rich-argparse==1.7.2",
    "ttkbootstrap==1.20.2",
    "requests"
]
keywords = ["network", "security", "scanner", "arp-spoofing", "dos", "cli", "gui", "ttkbootstrap", "scapy", "rich"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring"
]

[project.optional-dependencies]
test = [
    "pytest"
]

[project.urls]
Homepage = "https://github.com/OhadBragin/pynetkit"

[project.scripts]
pynetkit = "pynetkit.main:main"

[tool.setuptools.packages.find]
include = ["pynetkit*"]

[tool.setuptools.package-data]
pynetkit = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
